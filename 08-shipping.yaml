- name: configure shipping server
  hosts: shipping
  become: yes
  tasks:
    - name: enable maven3.9
      command: dnf module enable maven:3.9 -y

    - name: install maven and java-25
      dnf:
        name:
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25
          - mysql
        state: present

    # - name: find java25 path
    #   shell: readlink -f $(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -1)
    #   register: java25
    
    # - name: print java25 path
    #   debug:
    #     msg: "{{ java25 }}"

    # - name: make java25 as default
    #   command: alternatives --set java {{ java25.stdout }}

    # - name: set JAVA_HOME
    #   copy:
    #     content: "export JAVA_HOME={{ java25.stdout | dirname | dirname }}"
    #     dest: /etc/profile.d/java.sh

    - name: create roboshop system user
      user:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system user"

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove shipping.zip
      file:
        path: /tmp/shipping.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory

    - name: download shipping application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: unzip shipping
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: mvn version without JAVA_HOME
      command: mvn --version
      args:
        chdir: /app
      register: mvn_default

    - name: print mvn version without JAVA_HOME
      debug:
        msg: "{{ mvn_default.stdout_lines }}"

    - name: build shipping application
      command: mvn clean package
      args:
        chdir: /app
      # environment:
      #   JAVA_HOME: "{{ java25.stdout | dirname | dirname }}"
      #   MAVEN_OPTS: "-Djdk.tls.namedGroups=secp256r1,secp384r1"

    - name: move shipping jar to shipping.jar
      command: mv target/shipping.jar shipping.jar
      args:
        chdir: /app  

    - name: copy shipping service
      template: 
        src: shipping.service.j2
        dest: /etc/systemd/system/shipping.service

    - name: check cities data exists or not
      command: mysql -h "{{ mysql_host }}" -uroot -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
      register: cities_data_count

    - name: print cities data count
      debug:
        msg: "Cities data count: {{ cities_data_count.stdout }}"

    - name: daemon reload systemd
      systemd_service:
        daemon_reload: true

    - name: start shipping service
      service:
        name: shipping  
        state: started
        enabled: yes