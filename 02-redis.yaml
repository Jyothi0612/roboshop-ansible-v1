- name: configure redis server
  hosts: redis
  become: yes
  tasks:
    - name: enable redis 7
      command: dnf module enable redis:7 -y

    - name: install redis 7
      ansible.builtin.dnf:
        name: redis
        state: present

    - name: allow remote connections
      replace:
        path: /etc/redis/redis.conf
        regexp: 127.0.0.1
        replace: 0.0.0.0
    
    - name: allow remote connections
      replace:
        path: /etc/redis/redis.conf
        regexp: "protected-mode yes"
        replace: "protected-mode no"

    - name: start redis
      ansible.builtin.service:
        name: redis
        state: started
