- name: create ec2 instances and route53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: agenticengg.online
    ami_id: "ami-0055977a6e828a4f4"
    instance_type: "t3.micro"
    hosted_zone_id: "Z09464412E06R977EX6SZ"
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  # - name: print ec2 creation output
  #   debug:
  #     msg: "{{ ec2_output }}" 

  - name: create route53 record
    amazon.aws.route53:
      state: present
      zone: {{ domain_name }}
      hosted_zone_id: {{ hosted_zone_id }}
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      record: "{{ item.item  }}.{{ domain_name }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"