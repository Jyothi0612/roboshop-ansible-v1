- name: create ec2 instances and route53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: agenticengg.online
    ami_id: "ami-0055977a6e828a4f4"
    instance_type: "t3.micro"
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  - name: print the output
    debug:
      msg: "{{ ec2_output }}" 